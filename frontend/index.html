<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Organizer</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- ================= HEADER ================= -->

    <header>

        <h1>📋 To-Do Organizer</h1>

        <p>Folders → Subfolders → Tasks</p>

    </header>


    <!-- ================= MAIN ================= -->

    <main>


        <!-- Create Folder -->

        <section class="create-folder">

            <input
                type="text"
                id="folderInput"
                placeholder="Enter folder name..."
            >

            <button id="createFolderBtn">
                + Create Folder
            </button>

        </section>


        <!-- Folders will be displayed here -->

        <section id="foldersContainer">

        </section>


    </main>

cg
    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
